apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: elwavi/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: CUSTOMER_SERVICE_URL
              value: "http://customer-service:5000"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: MONGO_URI
              value: "mongodb://mongo:27017"
          readinessProbe:          # 503 -> le pod est retiré du Service
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:           # échec répété -> le pod est redémarré
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort           # seul point d'entrée exposé à l'extérieur
  selector:
    app: order-service
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30002
