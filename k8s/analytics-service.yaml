apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 1              # 1 seule partition Kafka : des réplicas en plus resteraient inactifs
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: elwavi/analytics-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: MONGO_URI
              value: "mongodb://mongo:27017"
          readinessProbe:          # 503 -> le pod est retiré du Service
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:           # échec répété -> le pod est redémarré
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  type: NodePort           # les statistiques sont destinées à être consultées
  selector:
    app: analytics-service
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30003
