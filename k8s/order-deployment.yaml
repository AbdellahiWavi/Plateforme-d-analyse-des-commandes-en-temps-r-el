apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:

    metadata:
      labels:
        app: order-service

    spec:

      containers:
      - name: order-service
        image: elwavi/order-service:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        env:
        - name: CUSTOMER_SERVICE_URL
          value: "http://customer-service:5000"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"