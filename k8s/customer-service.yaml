apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: elwavi/customer-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017"
          readinessProbe:          # 503 -> le pod est retiré du Service
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:           # échec répété -> le pod est redémarré
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  type: ClusterIP          # appelé uniquement par order-service
  # Pour une démo avec accès direct, remplacer par :
  # type: NodePort
  # ports: [{ port: 5000, targetPort: 5000, nodePort: 30001 }]
  selector:
    app: customer-service
  ports:
    - port: 5000
      targetPort: 5000
