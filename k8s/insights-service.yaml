# Création du secret (à ne jamais committer) :
#   kubectl create secret generic groq-secret --from-literal=GROQ_API_KEY=<votre_clé>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-service
spec:
  replicas: 1              # le planificateur de rapports est dans le service : 1 seul réplica
  selector:
    matchLabels:
      app: insights-service
  template:
    metadata:
      labels:
        app: insights-service
    spec:
      containers:
        - name: insights-service
          image: elwavi/insights-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: ANALYTICS_URL
              value: "http://analytics-service:5000"
            - name: MONGO_URI
              value: "mongodb://mongo:27017"
            - name: GROQ_MODEL
              value: "openai/gpt-oss-20b"
            - name: GROQ_REASONING_EFFORT   # propre aux modèles GPT OSS : à retirer pour un autre modèle
              value: "low"
            - name: INSIGHTS_INTERVAL_SECONDS
              value: "900"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-secret
                  key: GROQ_API_KEY
                  optional: true   # sans secret : le service démarre en mode dégradé
          readinessProbe:          # 503 -> le pod est retiré du Service
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:           # échec répété -> le pod est redémarré
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: insights-service
spec:
  type: NodePort
  selector:
    app: insights-service
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30004
