services:

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-service
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "5001:5000"
    networks:
      - plateform-net

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "5002:5000"
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:5000
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PYTHONUNBUFFERED: "1"
    depends_on:
      customer-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - plateform-net

  analytics-service:
    build: 
      context: ./analytics-service
    container_name: analytics-service
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - plateform-net 
  
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - plateform-net 

networks:
  plateform-net:
    driver: bridge