name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Customer Service
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/customer-service:latest \
            ./customer-service

      - name: Push Customer Service
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/customer-service:latest

      - name: Build Order Service
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/order-service:latest \
            ./order-service

      - name: Push Order Service
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/order-service:latest